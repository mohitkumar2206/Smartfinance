{% extends "base.html" %}

{% block title %}
EMI Calculator | SmartFinance
{% endblock %}

{% block content %}

<section class="section">

    <div class="container narrow">

        <div class="eyebrow">
            FINANCIAL TOOL
        </div>

        <h1>
            EMI Calculator
        </h1>

        <p class="muted">
            Calculate your monthly EMI, total interest
            and total repayment.
        </p>


        <div class="form-card">

            <div class="grid2">

                <label>
                    Loan Amount (₹)

                    <input
                        id="amount"
                        type="number"
                        value="500000"
                        min="0"
                    >
                </label>


                <label>
                    Annual Interest (%)

                    <input
                        id="rate"
                        type="number"
                        step="0.01"
                        value="10"
                        min="0"
                    >
                </label>


                <label>
                    Tenure (years)

                    <input
                        id="years"
                        type="number"
                        value="5"
                        min="1"
                    >
                </label>

            </div>


            <button
                class="btn full"
                type="button"
                onclick="calculateEMI()"
            >
                Calculate EMI
            </button>


            <div
                id="emiResult"
                class="calc-result"
            >
                Enter values and calculate.
            </div>

        </div>

    </div>

</section>

{% endblock %}
